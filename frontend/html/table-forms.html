<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Form nhập dữ liệu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="stylesheet" href="../css/table-forms.css"/>
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen flex flex-col">

    <!-- Thanh Header (Đã đổi thành "Form nhập dữ liệu" và xóa các dòng thừa) -->
    <header class="bg-white border-b border-teal-200 px-6 py-3.5 sticky top-0 z-30 shadow-sm">
        <div class="max-w-[1440px] mx-auto flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold shadow-sm">
                <span class="material-symbols-outlined">database</span>
            </div>
            <h1 class="font-bold text-teal-900 text-lg">Form nhập dữ liệu</h1>
        </div>
    </header>

    <!-- Khung nội dung chính -->
    <div class="max-w-[1440px] w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">

        <!-- Cột trái: Danh sách 22 bảng -->
        <aside class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm h-fit">
            <div class="flex items-center justify-between mb-3 px-2">
                <h2 class="font-bold text-xs uppercase tracking-wider text-teal-800">Danh sách 22 Bảng</h2>
                <span class="text-[11px] text-slate-400 font-medium">Số bản ghi</span>
            </div>
            <div id="table-list-nav" class="space-y-1 max-h-[75vh] overflow-y-auto pr-1 text-xs font-semibold custom-scrollbar"></div>
        </aside>

        <!-- Cột phải: Form nhập liệu & Bảng dữ liệu -->
        <main class="lg:col-span-9 space-y-6">

            <!-- Khu vực 1: Form Nhập / Cập nhật dữ liệu -->
            <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                <div class="border-b border-slate-100 pb-3">
                    <h2 id="current-table-title" class="font-bold text-lg text-teal-800">1. KHOA</h2>
                </div>

                <form id="dynamic-table-form" class="space-y-4">
                    <div id="dynamic-form-fields" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-xs"></div>

                    <div class="flex items-center gap-2.5 pt-2 border-t border-slate-100">
                        <button type="submit" id="btn-submit-form" class="px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm transition">
                            <span class="material-symbols-outlined text-base">save</span>
                            <span id="btn-submit-text">Thêm Bản Ghi Mới</span>
                        </button>
                        <button type="button" id="btn-reset-form" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition">
                            Làm mới / Hủy sửa
                        </button>
                    </div>
                </form>
            </section>

            <!-- Khu vực 2: Bảng dữ liệu (Đã xóa tiêu đề và dòng ghi chú thừa) -->
            <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <div class="overflow-x-auto border border-slate-200 rounded-xl">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead id="dynamic-table-head" class="bg-teal-50/80 text-teal-900 uppercase font-bold border-b border-teal-200"></thead>
                        <tbody id="dynamic-table-body" class="divide-y divide-slate-200"></tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="../js/table-forms.js"></script>
</body>
</html>
